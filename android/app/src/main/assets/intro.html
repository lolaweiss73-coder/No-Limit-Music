<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;height:100%;background:#000}#player{width:100%;height:100%;border:0}</style></head>
<body><div id="player"></div><script>
var player, resumePlayback=false, active=true;
function notify(event){window.location.href='intro-event://'+event;}
window.pauseIntro=function(){active=false;if(player&&player.getPlayerState){resumePlayback=player.getPlayerState()===1;player.pauseVideo();}};
window.resumeIntro=function(){active=true;if(resumePlayback&&player&&player.playVideo){resumePlayback=false;player.playVideo();}};
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{videoId:'nRfo1NdTN7k',width:'100%',height:'100%',
 playerVars:{autoplay:0,playsinline:1,controls:1,fs:0,origin:'https://avi-music-player.lolaweiss73.chatgpt.site'},
 events:{onReady:function(e){if(active)e.target.playVideo();else resumePlayback=true;},
 onStateChange:function(e){if(e.data===0)notify('ended');if(e.data===1){if(!active){resumePlayback=true;e.target.pauseVideo();}else notify('playing');}},
 onError:function(){notify('error');},onAutoplayBlocked:function(){notify('blocked');}}});
}
</script><script src="https://www.youtube.com/iframe_api" onerror="notify('error')"></script></body></html>

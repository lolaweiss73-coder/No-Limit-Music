name: Aroma Playlist APK
on:
  push:
    branches: [aroma-playlist]
    paths:
      - 'aroma-playlist/**'
      - '.github/workflows/aroma-playlist.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK available at $ANDROID_HOME"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle -p aroma-playlist :app:assembleDebug --stacktrace --no-daemon
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: aroma-playlist-debug-apk
          path: aroma-playlist/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

name: Aroma Playlist RELEASE APK
on:
  push:
    branches: [aroma-playlist]
    paths:
      - 'aroma-playlist/**'
      - '.github/workflows/aroma-playlist.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK available at $ANDROID_HOME"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build production release APK (unsigned)
        run: gradle -p aroma-playlist :app:assembleRelease --stacktrace --no-daemon
      - name: Zipalign unsigned release for offline signing
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -1)"
          APK="$(find aroma-playlist/app/build/outputs/apk/release -maxdepth 1 -name '*unsigned.apk' | head -1)"
          "$ZIPALIGN" -p -f 4 "$APK" aroma-playlist/app/build/outputs/apk/release/aroma-release-aligned-unsigned.apk
          "$ZIPALIGN" -c -v 4 aroma-playlist/app/build/outputs/apk/release/aroma-release-aligned-unsigned.apk
      - name: Export official Android apksigner tool for local signing
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-cli
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 7
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: aroma-playlist-release-unsigned
          path: aroma-playlist/app/build/outputs/apk/release/aroma-release-aligned-unsigned.apk
          if-no-files-found: error
          retention-days: 30

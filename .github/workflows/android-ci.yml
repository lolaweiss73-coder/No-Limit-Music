name: Android compile check

on:
  push:
    branches:
      - main
      - fix/embedded-playback
      - feature/auto-record-cloud-first-v15
      - feature/video-mp4-cloud-first-v16
      - feature/continuous-capture-playlist-sync-v17
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_BACKUP_PASSPHRASE: ${{ secrets.NLM_SIGNING_BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle
      - name: Install Android command-line SDK
        shell: bash
        run: |
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          printf "y\\n%.0s" {1..40} | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Check cloud service JavaScript syntax
        run: node --check server/server.mjs
      - name: Test encrypted signing backup tool
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/signing-backup.mjs
          TMP="$RUNNER_TEMP/signing-tool-test"
          mkdir -p "$TMP"
          printf 'PK\003\004test-key' > "$TMP/sample.zip"
          node tools/signing-backup.mjs encrypt "$TMP/sample.zip" \
            "$TMP/sample.encrypted.json" "$TMP/private-recovery.txt" \
            il.test.signing SampleApp alias
          node tools/signing-backup.mjs decrypt \
            "$TMP/sample.encrypted.json" "$TMP/decrypted.zip" \
            "$TMP/private-recovery.txt"
          cmp "$TMP/sample.zip" "$TMP/decrypted.zip"
      - name: Cloud server HTTP smoke check
        shell: bash
        run: |
          set -euo pipefail
          PORT=3055 DATA_DIR="$RUNNER_TEMP/no-limit-cloud-ci" UPLOAD_TOKEN=ci-only-secret node server/server.mjs &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3055/healthz > "$RUNNER_TEMP/cloud-health.json"; then break; fi
            sleep 1
          done
          grep -q '"ok":true' "$RUNNER_TEMP/cloud-health.json"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3055/api/recordings/01234567890.mp4)
          test "$code" = "401"
          python3 -c 'import struct,sys; f=open(sys.argv[1],"wb"); f.write(struct.pack(">I",24)+b"ftypisom"+struct.pack(">I",0)+b"isomiso2"+b"\x00"*8192); f.close()' "$RUNNER_TEMP/smoke.mp4"
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer ci-only-secret" -H "Content-Type: video/mp4" --data-binary @"$RUNNER_TEMP/smoke.mp4" http://127.0.0.1:3055/api/recordings/01234567890.mp4 > "$RUNNER_TEMP/upload.json"
          grep -q '"ok":true' "$RUNNER_TEMP/upload.json"
          curl --fail --silent --show-error -H "Authorization: Bearer ci-only-secret" -H "Range: bytes=0-23" http://127.0.0.1:3055/api/recordings/01234567890.mp4 -o "$RUNNER_TEMP/returned-header.bin"
          cmp "$RUNNER_TEMP/returned-header.bin" <(head -c 24 "$RUNNER_TEMP/smoke.mp4")
      - name: Compile and assemble test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Save build verification APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compile-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore release signing key from encrypted Git backup
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/release-signing-backup"
          mkdir -p "$BACKUP_DIR"
          # The v2 encrypted backup is in this branch; the secret is private.
          cp signing-backups/il.nolimits.music.v2.p12.encrypted.json "$BACKUP_DIR/backup.encrypted.json"
          node tools/signing-backup.mjs decrypt \
            "$BACKUP_DIR/backup.encrypted.json" "$BACKUP_DIR/key-archive.zip"
          unzip -qo "$BACKUP_DIR/key-archive.zip" -d "$BACKUP_DIR"
          KEYSTORE="$BACKUP_DIR/no-limit-music-release.p12"
          test -s "$KEYSTORE"
          test -s "$BACKUP_DIR/signing-password.txt"
          PASSWORD="$(cat "$BACKUP_DIR/signing-password.txt")"
          echo "::add-mask::$PASSWORD"
          printf '%s\n' \
            "NLM_SIGNING_KEYSTORE=$KEYSTORE" \
            "NLM_SIGNING_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          rm -f "$BACKUP_DIR/key-archive.zip"
      - name: Explain missing signing secret
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE == '' }}
        run: |
          echo "::warning::Debug build succeeded. Signed release requires private v2 repository secret NLM_SIGNING_BACKUP_PASSPHRASE, or can be signed securely offline."
      - name: Assemble signed production APK
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          
      - name: Verify production package and APK signature
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -Fi "Signer #1 certificate SHA-256 digest: 264eb910af0bc129a9847a68128c08199a13949af4001234e4044fdd24ae55fe"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='il.nolimits.music' versionCode='9'"
          cp "$APK" "$GITHUB_WORKSPACE/No-Limit-Music-1.7.1-release.apk"
          sha256sum "$GITHUB_WORKSPACE/No-Limit-Music-1.7.1-release.apk" > "$GITHUB_WORKSPACE/No-Limit-Music-1.7.1-release.sha256"

      - name: Save production APK
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: No-Limit-Music-1.7.1-signed-release
          path: |
            No-Limit-Music-1.7.1-release.apk
            No-Limit-Music-1.7.1-release.sha256
          if-no-files-found: error

      # Signed locally with a private, newly generated release identity.
      # No private key or signing password is ever uploaded to GitHub.
      - name: Prepare unsigned release for secure offline signing
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE == '' }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$APK" "$GITHUB_WORKSPACE/app-release-unsigned-aligned.apk"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$GITHUB_WORKSPACE/apksigner.jar"
          test -s "$GITHUB_WORKSPACE/apksigner.jar"
          # Public encrypted escrow + recovery utility; NEVER include the private
          # recovery passphrase or unencrypted key in CI artifacts.
          cp "$GITHUB_WORKSPACE/signing-backups/il.nolimits.music.v2.p12.encrypted.json" \
             "$GITHUB_WORKSPACE/signing-backup.encrypted.json"
          cp "$GITHUB_WORKSPACE/tools/signing-backup.mjs" "$GITHUB_WORKSPACE/signing-backup.mjs"
      - name: Save unsigned release and official Android signing utility
        if: ${{ env.SIGNING_BACKUP_PASSPHRASE == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: No-Limit-Music-1.7.1-offline-signing-input
          path: |
            app-release-unsigned-aligned.apk
            apksigner.jar
            signing-backup.encrypted.json
            signing-backup.mjs
          if-no-files-found: error

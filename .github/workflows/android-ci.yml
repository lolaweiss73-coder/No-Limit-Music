name: Android compile check

on:
  push:
    branches:
      - main
      - fix/embedded-playback
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle
      - name: Check preinstalled Android SDK
        run: sdkmanager --version
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and assemble test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Save build verification APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compile-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: MorinMusic test APK
on:
  push:
    branches:
      - feature/morinmusic-apk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack source (isolated from No-Limit-Music)
        run: |
          mkdir -p morinmusic/project
          tar -xJf morinmusic/source.tar.xz -C morinmusic/project
      - name: Add public YouTube playlists and start with playlist browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p morinmusic/project/app/src/main/assets
          cp android/app/src/main/assets/playlists.json morinmusic/project/app/src/main/assets/playlists.json
          cp morinmusic/PublicPlaylistsActivity.java morinmusic/project/app/src/main/java/com/morin/music/PublicPlaylistsActivity.java
          python3 - <<'PY'
          from pathlib import Path
          root = Path("morinmusic/project")
          p = root / "app/src/main/java/com/morin/music/MainActivity.java"
          s = p.read_text()
          needle = '        root.addView(subtitle);'
          assert needle in s
          s = s.replace(needle, needle + '\n        button(root, "🎵  הפלייליסטים הציבוריים שלי (27 רשימות)", () -> startActivity(new Intent(this, PublicPlaylistsActivity.class)));', 1)
          needle = '        refresh();\n    }'
          assert needle in s
          s = s.replace(needle, '        refresh();\n        if (saved == null) startActivity(new Intent(this, PublicPlaylistsActivity.class));\n    }', 1)
          p.write_text(s)
          p = root / "app/src/main/AndroidManifest.xml"
          s = p.read_text()
          needle = '        <service android:name=".PlaybackService"'
          assert needle in s
          s = s.replace(needle, '        <activity android:name=".PublicPlaylistsActivity" android:exported="false" />\n' + needle, 1)
          p.write_text(s)
          p = root / "app/build.gradle"
          s = p.read_text()
          assert "applicationId 'com.morin.music'" in s
          s = s.replace("applicationId 'com.morin.music'", "applicationId 'com.morin.music.playlists'")
          s = s.replace("versionCode 1", "versionCode 2").replace("versionName '0.1.0'", "versionName '0.2.0'")
          p.write_text(s)
          PY
      - name: Assemble debug APK
        working-directory: morinmusic/project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MorinMusic-debug-APK
          path: morinmusic/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Android emulator UI screenshot QA

on:
  push:
    branches:
      - feature/v18-public-playlist-saves-lrc

permissions:
  contents: read
  actions: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get previously compiled Android 1.8 debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-compile-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39903222925
      - name: Enable hardware acceleration for Android emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -lh *.apk
      - name: Launch app and inspect playlist UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p ui-shots
            adb install app-debug.apk
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n il.nolimits.music.dev/il.nolimits.music.IntroActivity
            sleep 7
            adb exec-out screencap -p > ui-shots/intro.png
            adb shell uiautomator dump /sdcard/qa-intro.xml
            adb pull /sdcard/qa-intro.xml ui-shots/qa-intro.xml
            python3 - <<'PY'
            import subprocess,re,xml.etree.ElementTree as ET
            root=ET.parse("ui-shots/qa-intro.xml").getroot()
            for n in root.iter("node"):
                if n.get("text")=="דלג":
                    xy=list(map(int,re.findall(r"\\d+",n.get("bounds",""))))
                    if len(xy)==4:
                        subprocess.run(["adb","shell","input","tap",str((xy[0]+xy[2])//2),str((xy[1]+xy[3])//2)],check=True)
                        break
            PY
            sleep 12
            adb exec-out screencap -p > ui-shots/library.png
            adb shell uiautomator dump /sdcard/qa-views.xml
            adb pull /sdcard/qa-views.xml ui-shots/qa-views.xml
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            root=ET.parse("ui-shots/qa-views.xml").getroot()
            nodes=list(root.iter("node"))
            assert any(n.get("package")=="il.nolimits.music.dev" for n in nodes), "Android application not visible"
            assert any("מוזיקה ללא גבולות" in n.get("text","") for n in nodes), "App title missing"
            print("ANDROID_APP_FOREGROUND_AND_TITLE_OK")
            PY
            adb shell input swipe 600 1300 600 400 350
            sleep 2
            adb exec-out screencap -p > ui-shots/scrolled.png
            adb logcat -d -t 4000 | grep -E 'FATAL EXCEPTION|AndroidRuntime|NoLimit' > ui-shots/qa-logs.txt || true
            test -s ui-shots/library.png
      - name: Upload screenshot and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-1-8-visual-QA
          path: ui-shots/
          if-no-files-found: warn

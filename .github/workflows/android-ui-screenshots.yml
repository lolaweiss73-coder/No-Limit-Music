name: Android emulator UI screenshot QA

on:
  push:
    branches:
      - feature/v18-public-playlist-saves-lrc

permissions:
  contents: read
  actions: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get previously compiled Android 1.8 debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-compile-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39903222925
      - name: Enable hardware acceleration for Android emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -lh *.apk
      - name: Launch app and inspect playlist UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p ui-shots
            adb install app-debug.apk
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n il.nolimits.music.dev/il.nolimits.music.IntroActivity
            sleep 7
            adb exec-out screencap -p > ui-shots/intro.png
            adb shell uiautomator dump /sdcard/qa-intro.xml
            adb pull /sdcard/qa-intro.xml ui-shots/qa-intro.xml
            adb shell input tap 540 2240
            sleep 12
            adb exec-out screencap -p > ui-shots/library.png
            adb shell uiautomator dump /sdcard/qa-views.xml
            adb pull /sdcard/qa-views.xml ui-shots/qa-views.xml
            grep -q 'il.nolimits.music.dev' ui-shots/qa-views.xml
            grep -q 'מוזיקה ללא גבולות' ui-shots/qa-views.xml
            adb shell input swipe 600 1300 600 400 350
            sleep 2
            adb exec-out screencap -p > ui-shots/scrolled.png
            adb shell input swipe 600 420 600 1770 350
            sleep 2
            adb shell input tap 540 820
            sleep 6
            adb exec-out screencap -p > ui-shots/playlist.png
            adb shell uiautomator dump /sdcard/qa-playlist.xml
            adb pull /sdcard/qa-playlist.xml ui-shots/qa-playlist.xml
            grep -q 'הפעל פלייליסט ברצף' ui-shots/qa-playlist.xml
            adb shell input tap 155 338
            sleep 2
            adb exec-out screencap -p > ui-shots/settings.png
            adb shell uiautomator dump /sdcard/qa-settings.xml
            adb pull /sdcard/qa-settings.xml ui-shots/qa-settings.xml
            grep -q 'שמירה לאופליין' ui-shots/qa-settings.xml
            adb logcat -d -t 4000 | grep -E 'FATAL EXCEPTION|AndroidRuntime|NoLimit' > ui-shots/qa-logs.txt || true
            test -s ui-shots/library.png
      - name: Upload screenshot and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-1-8-visual-QA
          path: ui-shots/
          if-no-files-found: warn

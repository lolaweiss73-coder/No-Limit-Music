name: MorinMusic Studio test APK
on:
  push:
    branches:
      - feature/morinmusic-apk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Use separate test package and launch Studio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g = Path('android/app/build.gradle')
          s = g.read_text().replace("applicationId 'il.nolimits.music'", "applicationId 'il.nolimits.music.studio'")
          s = s.replace("versionCode 5; versionName '1.3.1'", "versionCode 6; versionName '0.3.0-preview'")
          g.write_text(s)
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          original = '<activity android:name=".IntroActivity" android:exported="true">\n            <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>\n        </activity>'
          assert original in s, "Original launcher changed, must recheck manifest"
          s = s.replace(original, '<activity android:name=".IntroActivity" android:exported="false"/>\n'
                        '        <activity android:name=".StudioActivity" android:exported="true">\n'
                        '            <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>\n'
                        '        </activity>')
          s = s.replace('android:label="מוזיקה ללא גבולות"', 'android:label="MorinMusic Studio"')
          m.write_text(s)
          PY
      - name: Build Studio APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MorinMusic-Studio-Preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
